plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  Exclude:
    - 'sig/**/*'
    - 'datadog-json_logger.gemspec'
    - 'lib/datadog/tracing/contrib/bunny/patcher.rb'
    - 'vendor/**/*'
  NewCops: enable
  TargetRubyVersion: 3.4

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 30

Metrics/MethodLength:
  Max: 30

Metrics/BlockLength:
  Max: 100
  Exclude:
    - 'spec/**/*'

Metrics/ParameterLists:
  Max: 6

RSpec/MultipleMemoizedHelpers:
  Max: 10

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 4

RSpec/ExampleLength:
  Max: 15

RSpec/MessageChain:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false